name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: '.dotnet-install'
      PYRENODE_RUNTIME: 'coreclr'

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: ✅ Validate tag and SILABS-VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match required format vX.Y.Z"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          FILE_VERSION=$(tr -d '[:space:]' < SILABS-VERSION)
          if [[ -z "$FILE_VERSION" ]]; then
            cat <<'EOF'
          ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
          🛑  RELEASE ABORTED: SILABS-VERSION is empty  🛑
          ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

          📭 The SILABS-VERSION file must contain the release version (X.Y.Z)
             matching the tag.

          🚫 No build, artifacts, or GitHub release will be created.

          ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
          EOF
            echo "::error::SILABS-VERSION is empty; refusing to release"
            exit 1
          fi

          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            cat <<EOF
          ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
          🛑  RELEASE ABORTED: version mismatch  🛑
          ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

          💥 The Git tag and SILABS-VERSION do not match!

            🏷️  Git tag:          ${TAG}
            📌 Tag version:      ${TAG_VERSION}
            📄 SILABS-VERSION:   ${FILE_VERSION}

          👉 Update SILABS-VERSION to ${TAG_VERSION} (or retag with v${FILE_VERSION})
             before releasing.

          🚫 No build, artifacts, or GitHub release will be created.

          ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
          EOF
            echo "::error::SILABS-VERSION (${FILE_VERSION}) does not match tag version (${TAG_VERSION})"
            exit 1
          fi
          echo "SILABS-VERSION (${FILE_VERSION}) matches tag ${TAG}"

          DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq .default_branch)
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "${{ github.sha }}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Tag '$TAG' does not point to a commit on the default branch (${DEFAULT_BRANCH})"
            exit 1
          fi
          echo "Tag '$TAG' is on default branch '${DEFAULT_BRANCH}'"

      - name: 🪄 Init dev scripts
        run: ./r init

      - name: 🎁 Install .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 📓 Versions
        run: ./r versions

      - name: ⚒️ Create renode distribution package directory.
        run: ./r dist

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
