name: Renode CI

on:
  push:
    branches: ['silabs-main']
  pull_request:
    branches: ['silabs-main']
  workflow_dispatch:

# permissions can be required here when reusable workflows that need it are called
permissions:
  id-token: write
  actions: write
  contents: read

jobs:
  build:
    name: 🐧 Renode Build
    runs-on: ${{ github.repository_owner == 'SiliconLabsSoftware' && 'ubuntu-latest' || fromJSON('["prod","ubuntu","stable","medium","boston"]') }}
    env:
      DOTNET_INSTALL_DIR: '.dotnet-install'
      PYRENODE_RUNTIME: 'coreclr'

    steps:

      - name: 📥 Checkout (Create GitHub App Token)
        id: app-token
        if: github.repository_owner == 'SiliconLabsInternal'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SILABS_SVC_DEVOPS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SILABS_SVC_DEVOPS_GITHUB_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            renode
            renode-infrastructure
            renode-tlib

      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🪄 Init dev scripts
        run: ./r init

      - name: 🎁 Install .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 📓 Versions
        run: ./r versions

      - name: ⚒️ Create renode distribution package directory.
        run: ./r dist

      - name: ⚒️ Zip up the distribution package directory.
        run: ./r dist-zip

      - name: 📤 Upload distribution package (GitHub Artifacts)
        if: github.repository_owner != 'SiliconLabsInternal'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist.zip
          overwrite: true

      # curl, not uses: GitHub resolves every uses: while loading the workflow,
      # before if, and SiliconLabsSoftware cannot see SiliconLabsInternal/actions.
      - name: 📤 Upload distribution package (Artifactory)
        if: github.repository_owner == 'SiliconLabsInternal'
        env:
          JF_URL: https://artifactory.silabs.net/artifactory
          JF_REPOSITORY: sw-arch-generic-tools
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "X-JFrog-Art-Api: ${JF_ACCESS_TOKEN}" \
            --upload-file dist.zip \
            "${JF_URL}/${JF_REPOSITORY}/renode-temp/${GITHUB_RUN_ID}/dist.zip"

      - name: 📤 Upload portable package
        if: github.repository_owner == 'SiliconLabsInternal'
        env:
          JF_URL: https://artifactory.silabs.net/artifactory
          JF_REPOSITORY: sw-arch-generic-tools
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t zips < <(find dist -maxdepth 1 -type f -name '*.zip' | sort)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected one zip in dist/, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "X-JFrog-Art-Api: ${JF_ACCESS_TOKEN}" \
            --upload-file "${zips[0]}" \
            "${JF_URL}/${JF_REPOSITORY}/renode-temp/${GITHUB_RUN_ID}/renode.zip"

  create-test-matrix:
    name: 🧪 Create test matrix
    runs-on: ${{ github.repository_owner == 'SiliconLabsSoftware' && 'ubuntu-latest' || fromJSON('["prod","ubuntu","stable","medium","boston"]') }}
    outputs:
      test-matrix: ${{ steps.set-matrix.outputs.matrix-config }}
    steps:
      - name: 📥 Checkout (Create GitHub App Token)
        id: app-token
        if: github.repository_owner == 'SiliconLabsInternal'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SILABS_SVC_DEVOPS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SILABS_SVC_DEVOPS_GITHUB_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            renode
            renode-infrastructure
            renode-tlib

      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🧪 Set test matrix
        id: set-matrix
        run: ./r runtest --matrix >> $GITHUB_OUTPUT

  test:
    name: ⚗️ Test
    runs-on: ${{ github.repository_owner == 'SiliconLabsSoftware' && 'ubuntu-latest' || fromJSON('["prod","ubuntu","stable","medium","boston"]') }}
    needs: ['build', 'create-test-matrix']
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.create-test-matrix.outputs.test-matrix)}}
    env:
      DOTNET_INSTALL_DIR: '.dotnet-install'
      PYRENODE_RUNTIME: 'coreclr'
      PYRENODE_BIN: 'dist/renode'
      RENODE_PORTABLE_LOCATION: 'dist'

    steps:

      - name: 📥 Checkout (Create GitHub App Token)
        id: app-token
        if: github.repository_owner == 'SiliconLabsInternal'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SILABS_SVC_DEVOPS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SILABS_SVC_DEVOPS_GITHUB_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            renode
            renode-infrastructure
            renode-tlib

      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🪄 Init dev scripts
        run: ./r init

      - name: 🔨 Build host library
        run: ./r build-host-library

      - name: 📥 Download distribution package (GitHub Artifacts)
        if: github.repository_owner != 'SiliconLabsInternal'
        uses: actions/download-artifact@v7
        with:
          name: dist

      - name: 📥 Download distribution package (Artifactory)
        if: github.repository_owner == 'SiliconLabsInternal'
        env:
          JF_URL: https://artifactory.silabs.net/artifactory
          JF_REPOSITORY: sw-arch-generic-tools
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "X-JFrog-Art-Api: ${JF_ACCESS_TOKEN}" \
            --output dist.zip \
            "${JF_URL}/${JF_REPOSITORY}/renode-temp/${GITHUB_RUN_ID}/dist.zip"

      - name: 🔨 Unzip dist artifact.
        run: ./r dist-unzip

      - name: 🔨 Prepare dist artifact.
        run: ./r dist-prep

      # This Python can be PEP 668 externally managed, so system pip3 install
      # fails. This interpreter can create .venv; testing-set-up installs
      # pyrenode3, pybgapi, and test_lib into that venv.
      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🪚 Set up testing infrastructure.
        run: ./r testing-set-up

      - name: ⚗️ Run tests '${{matrix.test}}'
        env:
          # Not a default Actions environment variable. ./r needs it to read
          # the private firmware-dev release; without it GitHub answers 404.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./r runtest ${{ matrix.test }}

      # test_lib downloads remote ELFs/host binaries to /tmp (prefixed "renode_")
      # and removes them via an atexit handler. That handler does not run if a
      # test is force-killed (e.g. on timeout), so on these persistent
      # self-hosted runners stale binaries could accumulate in /tmp. Remove them
      # defensively regardless of the test outcome.
      - name: 🗑️ Clean up downloaded test binaries
        if: always()
        run: rm -f /tmp/renode_* || true

  delete-dist:
    name: 🗑️ Delete dist artifact
    runs-on: ${{ github.repository_owner == 'SiliconLabsSoftware' && 'ubuntu-latest' || fromJSON('["prod","ubuntu","stable","medium","boston"]') }}
    needs: [build, test]
    if: always() && github.repository_owner != 'SiliconLabsInternal'
    steps:
      - name: 🗑️ Delete dist artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "dist") | .id')"
          if [ -z "$ids" ]; then
            echo "No dist artifact to delete."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting artifact ${id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

